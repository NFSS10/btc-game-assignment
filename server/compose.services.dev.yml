name: btc-game-server-services-dev

services:
  db:
    image: postgres:17-alpine
    ports:
      - 5432:5432
    volumes:
      - btc_game_server_pgdata_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: btc-game-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d btc-game-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  btc_game_server_pgdata_dev:
